apiVersion: apps/v1
kind: Deployment
metadata:
  name: crud-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crud-api
  template:
    metadata:
      labels:
        app: crud-api
    spec:
      containers:
        - name: crud-api
          image: crud-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: api-config

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
